name: LogCraft contract tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run contract tests
        run: node tests/run-tests.mjs
