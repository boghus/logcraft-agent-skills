name: OpenRabbit PR Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Log OpenRabbit review start
        run: |
          echo "Starting OpenRabbit PR review."
          echo "Review mode: both"
          echo "LLM provider: openrouter"
          echo "LLM model: openrouter/free"

      - name: Run OpenRabbit review
        id: openrabbit
        uses: aryan6673/openrabbit@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced

      - name: Log OpenRabbit review result
        if: always()
        run: |
          echo "OpenRabbit PR review finished."
          echo "Job status: ${{ job.status }}"
          echo "OpenRabbit step outcome: ${{ steps.openrabbit.outcome }}"
