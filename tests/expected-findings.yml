version: 1

# Golden expectations for the candidate rules.
# These are intentionally small, deterministic examples that an agent or future
# LogCraft runner can use to validate rule behavior.

cases:
  - id: runtime-browser-script
    fixture: fixtures/runtime-aware/browser-script.astro
    findings:
      - rule: runtime-aware-logging
        severity: low
        expected: true
        reason: browser console output must be classified as client-side runtime

  - id: runtime-logger-destination
    fixture: fixtures/runtime-aware/logger-destination.js
    findings:
      - rule: runtime-aware-logging
        expected: false
        reason: console.error is the sink of an explicit logger destination, not application-level browser logging

  - id: log-amplification-observer
    fixture: fixtures/log-amplification/browser-observer.js
    findings:
      - rule: log-amplification
        severity: high
        expected: true
        reason: unbounded MutationObserver callback logs the full mutation collection

  - id: log-amplification-safe
    fixture: fixtures/log-amplification/browser-safe.js
    findings:
      - rule: log-amplification
        expected: false
        reason: debug-only logging with bounded sampling

  - id: log-amplification-finite-build
    fixture: fixtures/log-amplification/finite-build-validation.js
    findings:
      - rule: log-amplification
        expected: false
        reason: finite build validation with actionable per-item errors is not sufficient evidence of production log amplification

  - id: verbose-ci
    fixture: fixtures/verbose-output/ci-verbose.sh
    findings:
      - rule: verbose-output
        severity: medium
        expected: true
        reason: verbose output is enabled during normal CI/deploy execution

  - id: verbose-diagnostic
    fixture: fixtures/verbose-output/ci-diagnostic.sh
    findings:
      - rule: verbose-output
        expected: false
        reason: explicitly scoped troubleshooting workflow is a documented false positive

  - id: verbose-normal-output
    fixture: fixtures/verbose-output/normal-output.sh
    findings:
      - rule: verbose-output
        expected: false
        reason: ordinary command output is not evidence that verbose mode was explicitly enabled

  - id: secret-safe-leak
    fixture: fixtures/secret-safe-output/leaky.sh
    findings:
      - rule: secret-safe-output
        severity: high
        expected: true
        reason: verbose network diagnostics run with credential-bearing FTP arguments

  - id: secret-safe-safe
    fixture: fixtures/secret-safe-output/safe.sh
    findings:
      - rule: secret-safe-output
        expected: false
        reason: only safe metadata is emitted

  - id: secret-safe-read-no-output
    fixture: fixtures/secret-safe-output/secret-read-no-output.sh
    findings:
      - rule: secret-safe-output
        expected: false
        reason: a secret is read but only a safe constant message reaches the output sink

  - id: secret-safe-direct-output
    fixture: fixtures/secret-safe-output/direct-secret-output.sh
    findings:
      - rule: secret-safe-output
        severity: high
        expected: true
        reason: a secret expansion is written directly to an output sink

  - id: anonymous-deploy
    fixture: fixtures/anonymous-static-site/github-actions/deploy.yml
    findings:
      - rule: verbose-output
        severity: medium
        expected: true
        reason: lftp mirror uses --verbose during normal deployment
      - rule: github-actions-summary
        severity: medium
        expected: true
        reason: deployment result is emitted as raw output without a concise summary
      - rule: ci-context-rich-output
        expected: true
        reason: deploy output lacks a structured environment/revision/result summary

  - id: anonymous-ftp-test
    fixture: fixtures/anonymous-static-site/github-actions/ftp-check.yml
    findings:
      - rule: verbose-output
        expected: false
        reason: the FTP diagnostic workflow is manually triggered with workflow_dispatch
      - rule: secret-safe-output
        severity: high
        expected: true
        reason: verbose diagnostics are combined with FTP credentials

  - id: anonymous-safe-summary
    fixture: fixtures/anonymous-static-site/github-actions/safe-summary.yml
    findings:
      - rule: github-actions-summary
        expected: false
        reason: concise environment, commit, build, and result context is already provided

  - id: external-anonymous-runtime
    fixture: fixtures/benchmarks/anonymous-project/ci-reporter.ts
    findings:
      - rule: runtime-aware-logging
        expected: false
        reason: the fixture is a Node/CI test reporter, not browser application logging
      - rule: log-amplification
        expected: false
        reason: test-result callbacks are not established as an unbounded high-frequency production path
      - rule: secret-safe-output
        expected: false
        reason: no secret value or credential-bearing object is logged

  - id: external-anonymous-ci
    fixture: fixtures/benchmarks/anonymous-project/ci.yml
    findings:
      - rule: ci-context-rich-output
        severity: medium
        expected: true
        reason: important build and test operations rely on raw workflow output without a consistent operational summary
      - rule: github-actions-summary
        severity: medium
        expected: true
        reason: important CI results are not surfaced through a concise step summary
      - rule: verbose-output
        expected: false
        reason: no permanently enabled verbose or debug flag is present

  - id: external-anonymous-safe-summary
    fixture: fixtures/benchmarks/anonymous-project/safe-summary.yml
    findings:
      - rule: github-actions-summary
        expected: false
        reason: the deployment exposes concise environment, revision, and result context through GITHUB_STEP_SUMMARY

  - id: transversal-existing-capability
    fixture: fixtures/transversal-principles/existing-capability.js
    findings:
      - rule: transversal-principles
        severity: medium
        expected: true
        reason: an existing request correlation capability should be reused instead of introducing a second mechanism

  - id: transversal-existing-capability-safe
    fixture: fixtures/transversal-principles/existing-capability-safe.js
    findings:
      - rule: transversal-principles
        expected: false
        reason: there is no existing correlation mechanism to duplicate

  - id: transversal-unnecessary-mechanism
    fixture: fixtures/transversal-principles/unnecessary-mechanism.js
    findings:
      - rule: transversal-principles
        severity: medium
        expected: true
        reason: an additional observability mechanism is unnecessary when the existing logger and context propagation satisfy the need

  - id: transversal-unnecessary-mechanism-safe
    fixture: fixtures/transversal-principles/unnecessary-mechanism-safe.js
    findings:
      - rule: transversal-principles
        expected: false
        reason: the existing logger cannot satisfy the distributed correlation requirement

  - id: transversal-unsupported-capability
    fixture: fixtures/transversal-principles/unsupported-capability.js
    findings:
      - rule: transversal-principles
        severity: medium
        expected: true
        reason: recommendations must respect the logger capabilities actually available in the project

  - id: transversal-unsupported-capability-safe
    fixture: fixtures/transversal-principles/unsupported-capability-safe.js
    findings:
      - rule: transversal-principles
        expected: false
        reason: the requested structured-field capability is explicitly supported by the existing logger

  - id: transversal-appropriate-observability
    fixture: fixtures/transversal-principles/appropriate-observability.js
    findings:
      - rule: transversal-principles
        severity: medium
        expected: true
        reason: latency distribution is better represented by a metric than by one log per high-volume item

  - id: transversal-appropriate-observability-safe
    fixture: fixtures/transversal-principles/appropriate-observability-safe.js
    findings:
      - rule: transversal-principles
        expected: false
        reason: an operational failure requires diagnostic details that a metric alone would not preserve

  - id: log-frequency-repeated-info
    fixture: fixtures/log-frequency/repeated-info.js
    findings:
      - rule: log-frequency
        severity: medium
        expected: true
        reason: repeated INFO output inside a loop emits the same message without evidence of new information per occurrence

  - id: log-frequency-repeated-debug-with-context
    fixture: fixtures/log-frequency/repeated-debug-with-context.js
    findings:
      - rule: log-frequency
        expected: false
        reason: repeated DEBUG output includes an entity identifier that makes each occurrence diagnostically distinct

  - id: duration-unqualified
    fixture: fixtures/duration-and-performance/unqualified-duration.js
    findings:
      - rule: duration-and-performance
        severity: medium
        expected: true
        reason: duration is logged without an explicit unit, preventing consistent automated interpretation

  - id: duration-numeric-unit
    fixture: fixtures/duration-and-performance/numeric-duration.js
    findings:
      - rule: duration-and-performance
        expected: false
        reason: duration is represented numerically with an explicit and consistent unit

  - id: when-to-log-meaningful-event
    fixture: fixtures/when-to-log/meaningful-event.js
    findings:
      - rule: when-to-log
        expected: false
        reason: the log records the outcome of an important operation and provides useful operational information

  - id: when-to-log-routine-flow
    fixture: fixtures/when-to-log/routine-flow.js
    findings:
      - rule: when-to-log
        severity: medium
        expected: true
        reason: routine execution messages do not provide an operational question the log helps answer

  - id: when-not-to-log-routine-flow
    fixture: fixtures/when-not-to-log/routine-flow.js
    findings:
      - rule: when-not-to-log
        severity: medium
        expected: true
        reason: method entry and routine processing messages add execution noise without operational value

  - id: when-not-to-log-meaningful-event
    fixture: fixtures/when-not-to-log/meaningful-event.js
    findings:
      - rule: when-not-to-log
        expected: false
        reason: an important synchronization outcome provides actionable operational information

  - id: context-sufficient
    fixture: fixtures/context/sufficient-context.js
    findings:
      - rule: context
        expected: false
        reason: the event includes a relevant entity, operation continuity, and known outcome

  - id: context-insufficient
    fixture: fixtures/context/insufficient-context.js
    findings:
      - rule: context
        severity: medium
        expected: true
        reason: a failure log lacks relevant context needed to understand or relate the operation

  - id: context-initial-context-followed-by-failure
    fixture: fixtures/context/initial-context-followed-by-failure.js
    findings:
      - rule: context
        severity: medium
        expected: true
        reason: every failure event must carry sufficient context independently of earlier logs

  - id: context-balanced-arguments
    fixture: fixtures/context/balanced-arguments.js
    findings:
      - rule: context
        expected: false
        reason: parentheses inside quotes or nested calls do not truncate the captured log body
